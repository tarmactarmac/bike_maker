<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Bike Draft - FIFA Style</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #000; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden; }
        
        .header h1 { font-size: 1.8rem; color: #fff; margin: 20px 0; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary); }

        /* 피파 카드 스타일 */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 1100px; }
        .card { 
            background: linear-gradient(135deg, #111 0%, #222 100%); 
            border: 2px solid #333; 
            border-radius: 12px; 
            padding: 15px 10px; 
            text-align: center; 
            position: relative; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            height: 120px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            overflow: hidden;
        }

        /* S급 당첨 시 카드 연출 */
        .card.s-win { 
            border-color: var(--s-rank); 
            box-shadow: 0 0 25px rgba(255, 207, 64, 0.4); 
            animation: shake 0.5s ease-in-out; 
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-1deg); }
            75% { transform: translateX(5px) rotate(1deg); }
        }

        .label { font-size: 0.65rem; color: #777; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 0.85rem; font-weight: 800; line-height: 1.3; color: #fff; min-height: 3em; display: flex; align-items: center; justify-content: center; z-index: 2; }

        /* 랭크 뱃지 - 피파의 능력치 오버롤 느낌 */
        .rank-badge { 
            position: absolute; top: 8px; left: 8px; 
            font-size: 0.7rem; font-weight: 900; 
            padding: 4px 8px; border-radius: 4px; 
            display: none; z-index: 10; 
        }

        /* 애니메이션 효과 */
        .rolling { opacity: 0.3; filter: blur(3px); transform: translateY(5px); }
        .text-S { 
            color: var(--s-rank); font-weight: 900; font-size: 1.1rem;
            text-shadow: 0 0 15px var(--s-rank);
            animation: glow 0.8s infinite alternate;
        }
        @keyframes glow { from { opacity: 0.8; transform: scale(0.98); } to { opacity: 1; transform: scale(1.05); } }

        /* 하단 결과창 */
        .total-rank-box { margin: 25px 0; padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid #333; text-align: center; display: none; width: 100%; max-width: 500px; }
        .total-rank-value { font-size: 2.2rem; font-weight: 900; margin-bottom: 5px; font-style: italic; }

        .btn-draw { 
            margin-top: 20px; padding: 18px 80px; 
            font-size: 1.5rem; font-weight: 900; color: white; 
            background: linear-gradient(to right, #ff3e3e, #ff6b6b); 
            border: none; border-radius: 50px; cursor: pointer; 
            transition: 0.3s; box-shadow: 0 10px 20px rgba(255, 62, 62, 0.3);
        }
        .btn-draw:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(255, 62, 62, 0.4); }
        .btn-draw:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

        /* 리스트 스타일 */
        .data-viewer { margin-top: 40px; width: 100%; max-width: 1100px; padding: 0 10px; }
        .roster-toggle-btn { width: 100%; background: #111; border: 1px solid #333; color: #555; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .roster-content { max-height: 0; overflow: hidden; transition: max-height 0.5s ease; background: #080808; }
        .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .data-item { display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; padding: 5px 0; font-size: 0.7rem; }
        .rank-S-txt { color: var(--s-rank); font-weight: bold; }

        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } .data-grid { grid-template-columns: 1fr; } }
    </style>
</head>

        async function finalizeCard(cardId, valId, item, hero) {
            const card = document.getElementById(cardId);
            const valEl = document.getElementById(valId);
            valEl.classList.remove('rolling');
            
            if (item.r === 'S') {
                card.classList.add('s-win'); // S급 당첨 연출 (흔들기 + 빛)

                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)];
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];

            const resW = data.w[Math.floor(Math.random()*data.w.length)];
            const resG = data.g[Math.floor(Math.random()*data.g.length)];

            // 히어로 체크
            let hero = null;
            const fn = resF.n.toLowerCase(); const wn = resW.n.toLowerCase();
            if (fn.includes("colnago") && wn.includes("enve")) hero = "Tadej Pogačar";
            else if (fn.includes("cervelo") && wn.includes("reserve")) hero = "Jonas Vingegaard";
            else if (fn.includes("tarmac sl8") && wn.includes("roval")) hero = "Remco Evenepoel";

            // 순차적 공개 (피파 팩 개봉 느낌)
            await new Promise(r => setTimeout(r, 1200));
            await finalizeCard('card-f', 'f', resF, (hero && (fn.includes("colnago")||fn.includes("cervelo")||fn.includes("tarmac"))) ? hero : null);

            await new Promise(r => setTimeout(r, 600));
            await finalizeCard('card-w', 'w', resW, (hero && (wn.includes("enve")||wn.includes("reserve")||wn.includes("roval"))) ? hero : null);

            await new Promise(r => setTimeout(r, 600));
            await finalizeCard('card-g', 'g', resG, null);

            clearInterval(interval);
            document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
            document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)];
            document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];
            document.querySelectorAll('.rolling').forEach(v => v.classList.remove('rolling'));

            // 최종 랭크 계산 및 표시
            const score = {S:4, A:3, B:2, C:1};
            const avg = (score[resF.r]+score[resW.r]+score[resG.r])/3;
            const finalR = avg >= 3.7 ? "S" : avg >= 3 ? "A" : avg >= 2 ? "B" : "C";
            
            const rVal = document.getElementById('rank-val');
            rVal.innerText = hero ? "HERO CLASS" : finalR + " CLASS";
            rVal.style.color = (finalR==='S' || hero) ? "var(--s-rank)" : "#fff";
            document.getElementById('rank-desc').innerText = hero ? `🔥 LEGENDARY: ${hero}` : "DRAFT COMPLETED";
            document.getElementById('total-rank').style.display = 'block';

            btn.disabled = false;
        }

        function toggleRoster() {
            const content = document.getElementById('roster-content');
            content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
        }

        function init() {
            const cfgs = [{k:'f',l:'list-f',c:'count-f'},{k:'w',l:'list-w',c:'count-w'},{k:'g',l:'list-g',c:'count-g'}];
            cfgs.forEach(cfg => {
                document.getElementById(cfg.c).innerText = data[cfg.k].length;
                document.getElementById(cfg.l).innerHTML = data[cfg.k].map(i => `
                    <div class="data-item">
                        <span class="${i.r==='S'?'rank-S-txt':''}">[${i.b}] ${i.n}</span>
                        <span>${i.r}</span>
                    </div>`).join('');
            });
        }
        window.onload = init;
    </script>
</body>
</html>
