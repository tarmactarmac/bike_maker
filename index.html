<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Bike Draft</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden; }
        .header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.6rem; color: var(--primary); margin: 0; letter-spacing: -1px; text-transform: uppercase; font-weight: 900; }
        
        .total-rank-box { margin-bottom: 20px; padding: 15px 30px; border-radius: 20px; background: #1a1a1a; border: 2px solid #333; text-align: center; display: none; width: 100%; max-width: 500px; box-sizing: border-box; }
        .total-rank-value { font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; line-height: 1; }
        .total-rank-desc { font-size: 0.85rem; color: var(--primary); font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 1100px; }
        .card { background: #151515; border: 1px solid #222; border-radius: 15px; padding: 12px 8px; text-align: center; position: relative; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; height: 100px; box-sizing: border-box; overflow: hidden; }
        .card.active { border-color: #444; background: #1c1c1c; }
        .label { font-size: 0.6rem; color: #555; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; }
        .rank-badge { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; font-weight: 900; padding: 2px 6px; border-radius: 50px; display: none; z-index: 10; }
        .value { font-size: 0.78rem; font-weight: 700; line-height: 1.2; color: #fff; word-break: keep-all; min-height: 2.5em; display: flex; align-items: center; justify-content: center; transition: 0.2s; }

        .rolling { opacity: 0.4; filter: blur(2px); transform: scale(0.95); }
        .text-S { color: var(--s-rank); font-weight: 900; text-shadow: 0 0 10px rgba(255, 207, 64, 0.5); animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { opacity: 0.7; } to { opacity: 1; } }

        .btn-draw { margin-top: 30px; padding: 18px 80px; font-size: 1.4rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,62,62,0.3); }
        .btn-draw:disabled { background: #333; cursor: not-allowed; box-shadow: none; }

        .rank-S { background: var(--s-rank); color: #000; box-shadow: 0 0 15px var(--s-rank); }
        .rank-A { background: var(--a-rank); color: #000; }
        .rank-B { background: var(--b-rank); color: #fff; }
        .rank-C { background: var(--c-rank); color: #fff; }

        .data-viewer { margin-top: 50px; width: 100%; max-width: 1100px; padding: 0 10px; box-sizing: border-box; }
        .roster-toggle-btn { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #888; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .roster-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #111; border-radius: 0 0 12px 12px; }
        .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .data-list { font-size: 0.7rem; color: #aaa; max-height: 300px; overflow-y: auto; border-top: 1px solid #222; }
        .data-item { display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; padding: 6px 0; }
        .rank-S-txt { color: var(--s-rank); font-weight: bold; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        function showResult(f, g, w, hero) {
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };
            const score = scoreMap[f.r] + scoreMap[g.r] + scoreMap[w.r];
            const avg = score / 3;
            const finalRank = avg >= 3.7 ? "S" : avg >= 3.0 ? "A" : avg >= 2.0 ? "B" : "C";
            
            const rVal = document.getElementById('rank-val');
            const rDesc = document.getElementById('rank-desc');

                rVal.className = "total-rank-value text-S";
                rDesc.innerText = `🔥 전설의 탄생! ${hero} 세팅!`;
            } else {

                rVal.className = 'total-rank-value text-' + (finalRank === 'S' ? 'S' : '');
                rDesc.innerText = finalRank === 'S' ? "🏆 천상계 기함 세팅 완료!" : finalRank === 'A' ? "🚀 상급 레이싱!" : "🚴 즐거운 라이딩 되세요!";
            }
            document.getElementById('total-rank').style.display = 'block';
            document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
        }

        function toggleRoster() {
            const content = document.getElementById('roster-content');
            content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
        }

        function init() {
            const configs = [{k:'f', l:'list-f', c:'count-f'}, {k:'w', l:'list-w', c:'count-w'}, {k:'g', l:'list-g', c:'count-g'}];
            configs.forEach(conf => {
                document.getElementById(conf.c).innerText = data[conf.k].length;
                document.getElementById(conf.l).innerHTML = data[conf.k].map(i => `
                    <div class="data-item">
                        <span class="${i.r==='S'?'rank-S-txt':''}">${i.b} ${i.n}</span>
                        <span style="opacity:0.3;font-size:0.6rem;">${i.r}</span>
                    </div>`).join('');
            });
        }
        window.onload = init;
    </script>
</body>
</html>
