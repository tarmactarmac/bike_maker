<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Top 20 Bike Draft</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden; }
        .header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.6rem; color: var(--primary); margin: 0; letter-spacing: -1px; text-transform: uppercase; font-weight: 900; }
        .total-rank-box { margin-bottom: 20px; padding: 15px 30px; border-radius: 20px; background: #1a1a1a; border: 2px solid #333; text-align: center; display: none; width: 100%; max-width: 500px; box-sizing: border-box; }
        .total-rank-value { font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; line-height: 1; }
        .total-rank-desc { font-size: 0.85rem; color: var(--primary); font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 1100px; }
        .card { background: #151515; border: 1px solid #222; border-radius: 15px; padding: 12px 8px; text-align: center; position: relative; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; height: 100px; box-sizing: border-box; }
        .label { font-size: 0.6rem; color: #555; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; }
        .rank-badge { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; font-weight: 900; padding: 2px 6px; border-radius: 50px; display: none; z-index: 10; }
        .value { font-size: 0.78rem; font-weight: 700; line-height: 1.2; color: #fff; word-break: keep-all; min-height: 2.4em; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .card { height: 90px; }
            .btn-draw { width: 100%; padding: 15px 0 !important; font-size: 1.2rem !important; margin-top: 20px !important; }
        }
        .btn-draw { margin-top: 30px; padding: 18px 80px; font-size: 1.4rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,62,62,0.3); }
        .rolling { opacity: 0.4; filter: blur(2px); }
        .rank-S { background: var(--s-rank); color: #000; box-shadow: 0 0 15px var(--s-rank); }
        .rank-A { background: var(--a-rank); color: #000; }
        .text-S { color: var(--s-rank); font-weight: 900; }
        
        /* 로스터 리스트 스타일 */
        .data-viewer { margin-top: 50px; width: 100%; max-width: 1100px; }
        .roster-toggle-btn { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; margin-bottom: 10px; }
        .roster-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #0f0f0f; border-radius: 10px; }
        .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
        .data-column h3 { font-size: 0.7rem; color: #888; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .rank-S-txt { color: var(--s-rank); font-weight: bold; }
        .rank-A-txt { color: #ccc; }
    </style>
</head>
<body>
    <div class="header"><h1>너만의자전거로너만의라이딩을해</h1></div>
    <div id="total-rank" class="total-rank-box">
        <div class="total-rank-value" id="rank-val">-</div>
        <div id="rank-desc" class="total-rank-desc">-</div>
    </div>
    <div class="grid" id="main-grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">Frame</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-g"><div class="rank-badge" id="r-g"></div><div class="label">Groupset</div><div class="value" id="g">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">Wheelset</div><div class="value" id="w">---</div></div>
        <div class="card"><div class="label">Saddle</div><div class="value" id="s">---</div></div>
        <div class="card"><div class="label">Tire</div><div class="value" id="t">---</div></div>
        <div class="card"><div class="label">Pedal</div><div class="value" id="p">---</div></div>
    </div>
    <button class="btn-draw" onclick="run()">가즈아~</button>

    <div class="data-viewer">
        <button class="roster-toggle-btn" onclick="toggleRoster()">전체 로스터 리스트 보기</button>
        <div id="roster-content" class="roster-content">
            <div class="data-grid">
                <div class="data-column">
                    <h3>프레임 (<span id="count-f">0</span>)</h3>
                    <div id="list-f" class="data-list"></div>
                </div>
                <div class="data-column">
                    <h3>휠셋 (<span id="count-w">0</span>)</h3>
                    <div id="list-w" class="data-list"></div>
                </div>
                <div class="data-column">
                    <h3>그룹셋 (<span id="count-g">0</span>)</h3>
                    <div id="list-g" class="data-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = {
            f: [
                {b:"Specialized", n:"S-Works Tarmac SL8", r:"S"}, {b:"Specialized", n:"S-Works Aethos", r:"S"}, {b:"Specialized", n:"S-Works Roubaix SL8", r:"S"}, {b:"Specialized", n:"S-Works Shiv TT", r:"S"}, {b:"Specialized", n:"Tarmac SL8 Pro", r:"A"}, {b:"Specialized", n:"Aethos Pro", r:"A"}, {b:"Specialized", n:"Roubaix SL8 Expert", r:"A"}, {b:"Specialized", n:"Tarmac SL7 Comp", r:"B"}, {b:"Specialized", n:"Allez E5", r:"C"},
                {b:"Trek", n:"Madone SLR 9 Gen 8", r:"S"}, {b:"Trek", n:"Emonda SLR 9", r:"S"}, {b:"Trek", n:"Domane SLR 9", r:"S"}, {b:"Trek", n:"Madone SL 7", r:"A"}, {b:"Trek", n:"Emonda SL 7", r:"A"}, {b:"Trek", n:"Domane SL 7", r:"A"}, {b:"Trek", n:"Emonda SL 5", r:"B"}, {b:"Trek", n:"Domane AL 2", r:"C"},
                {b:"Canyon", n:"Aeroad CFR", r:"S"}, {b:"Canyon", n:"Ultimate CFR", r:"S"}, {b:"Canyon", n:"Endurace CFR", r:"S"}, {b:"Canyon", n:"Speedmax CFR", r:"S"}, {b:"Canyon", n:"Aeroad CF SLX", r:"A"}, {b:"Canyon", n:"Ultimate CF SLX", r:"A"}, {b:"Canyon", n:"Endurace CF SLX", r:"A"}, {b:"Canyon", n:"Aeroad CF SL", r:"B"}, {b:"Canyon", n:"Ultimate CF SL", r:"B"}, {b:"Canyon", n:"Endurace AL", r:"C"},
                {b:"Cervelo", n:"S5", r:"S"}, {b:"Cervelo", n:"R5", r:"S"}, {b:"Cervelo", n:"P5", r:"S"}, {b:"Cervelo", n:"Soloist", r:"A"},
                {b:"Pinarello", n:"Dogma F", r:"S"}, {b:"Pinarello", n:"Dogma X", r:"S"}, {b:"Pinarello", n:"F7", r:"A"}, {b:"Pinarello", n:"X7", r:"B"},
                {b:"Colnago", n:"Y1Rs", r:"S"}, {b:"Colnago", n:"V5Rs", r:"S"}, {b:"Colnago", n:"V4Rs", r:"S"}, {b:"Colnago", n:"C68", r:"S"},
                {b:"Cannondale", n:"SuperSix EVO Lab71", r:"S"}, {b:"Cannondale", n:"SystemSix Hi-MOD", r:"S"}, {b:"Cannondale", n:"SuperSix EVO Hi-MOD", r:"A"},
                {b:"Giant", n:"Propel Advanced SL 0", r:"S"}, {b:"Giant", n:"TCR Advanced SL 0", r:"S"}, {b:"Giant", n:"Defy Advanced SL", r:"S"},
                {b:"BMC", n:"Teammachine SLR01", r:"S"}, {b:"Scott", n:"Foil RC Ultimate", r:"S"}, {b:"Factor", n:"OSTRO VAM", r:"S"},
                {b:"Winspace", n:"T1550 (Aero)", r:"S"}, {b:"SEKA", n:"Exceed RDC", r:"S"}, {b:"Evolve", n:"Cima", r:"S"}
            ],
            g: [
                {b:"Shimano", n:"Dura-Ace R9270 Di2", r:"S"}, {b:"SRAM", n:"RED AXS (2024)", r:"S"}, {b:"Campagnolo", n:"Super Record Wireless", r:"S"},
                {b:"Shimano", n:"Ultegra R8170 Di2", r:"A"}, {b:"SRAM", n:"Force AXS", r:"A"}, {b:"Shimano", n:"105 R7170 Di2", r:"B"}, {b:"Shimano", n:"105 Mechanical", r:"C"}
            ],
            w: [
                {b:"Scope", n:"Artech 6 (Aero)", r:"S"}, {b:"Scope", n:"Artech 4 (All-road)", r:"S"},
                {b:"Roval", n:"Rapide CLX III", r:"S"}, {b:"Roval", n:"Alpinist CLX III", r:"S"},
                {b:"Zipp", n:"454 NSW", r:"S"}, {b:"Enve", n:"SES 4.5", r:"S"},
                {b:"Lightweight", n:"Meilenstein Evo", r:"S"}, {b:"Princeton", n:"Wake 7580", r:"S"},
                {b:"Shimano", n:"Dura-Ace C50 R9270", r:"S"}, {b:"Zipp", n:"404 Firecrest", r:"A"},
                {b:"Shimano", n:"105 Carbon C46", r:"B"}
            ],
            s: ["S-Works Power Mirror", "Fizik Vento Argo R1", "Selle Italia SLR Boost"],
            t: ["Continental GP5000 S TR", "Vittoria Corsa PRO", "Pirelli P ZERO Race TLR"],
            p: ["Shimano Dura-Ace PD-R9100", "Look Keo Blade Carbon Ti", "Wahoo Speedplay Zero Nano"],
            size: ["25C", "28C", "30C"]
        };

        // S급 등장 연출 함수
        async function animateSRank(element, item) {
            element.classList.remove('rolling');
            element.innerHTML = `<span class="text-S">Rank: S</span>`;
            await new Promise(r => setTimeout(r, 600));
            element.innerHTML = `<span class="text-S">${item.b}</span>`;
            await new Promise(r => setTimeout(r, 600));
            element.innerHTML = `<span class="text-S">${item.n}</span>`;
        }

        function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            document.querySelectorAll('.rank-badge').forEach(el => { el.style.display = 'none'; el.className = 'rank-badge'; });
            document.getElementById('total-rank').style.display = 'none';
            
            let count = 0;
            const timer = setInterval(() => {
                const f = data.f[Math.floor(Math.random()*data.f.length)];
                const g = data.g[Math.floor(Math.random()*data.g.length)];
                const w = data.w[Math.floor(Math.random()*data.w.length)];
                
                document.getElementById('f').innerText = f.n;
                document.getElementById('g').innerText = g.n;
                document.getElementById('w').innerText = w.n;
                document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)] + " (" + data.size[Math.floor(Math.random()*data.size.length)] + ")";
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];
                
                document.querySelectorAll('.value').forEach(v => v.classList.add('rolling'));
                count++;
                
                if(count > 25) {
                    clearInterval(timer);
                    btn.disabled = false;
                    document.querySelectorAll('.rolling').forEach(v => v.classList.remove('rolling'));
                    
                    const finalF = data.f[Math.floor(Math.random()*data.f.length)];
                    const finalG = data.g[Math.floor(Math.random()*data.g.length)];
                    const finalW = data.w[Math.floor(Math.random()*data.w.length)];
                    
                    document.getElementById('f').innerText = finalF.n;
                    document.getElementById('g').innerText = finalG.n;
                    document.getElementById('w').innerText = finalW.n;
                    
                    // S급 연출 적용 (프레임, 그룹셋, 휠셋에만 적용)
                    if(finalF.r === 'S') animateSRank(document.getElementById('f'), finalF);
                    if(finalG.r === 'S') animateSRank(document.getElementById('g'), finalG);
                    if(finalW.r === 'S') animateSRank(document.getElementById('w'), finalW);
                    
                    showResult(finalF, finalG, finalW);
                }
            }, 60);
        }

        function showResult(f, g, w) {
            const parts = {f, g, w};
            let score = 0;
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };
            let hero = null;
            const fn = f.n.toLowerCase();
            const wn = w.n.toLowerCase();

            if (fn.includes("colnago") && wn.includes("enve")) hero = "Tadej Pogačar (UAE)";
            else if (fn.includes("cervelo") && wn.includes("reserve")) hero = "Jonas Vingegaard (Visma)";
            else if (fn.includes("tarmac sl8") && wn.includes("roval")) hero = "Remco Evenepoel (Soudal)";
            
            for(let key in parts) {
                const rankCode = parts[key].r || "C";
                const badge =
