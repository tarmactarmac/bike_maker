<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Premium Bike Draft</title>
    <style>
        /* 기존 스타일 유지 */
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden; }
        .header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.6rem; color: var(--primary); margin: 0; letter-spacing: -1px; text-transform: uppercase; font-weight: 900; }
        
        .total-rank-box { margin-bottom: 20px; padding: 15px 30px; border-radius: 20px; background: #1a1a1a; border: 2px solid #333; text-align: center; display: none; width: 100%; max-width: 500px; box-sizing: border-box; }
        .total-rank-value { font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; line-height: 1; }
        .total-rank-desc { font-size: 0.85rem; color: var(--primary); font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 1100px; }
        .card { background: #151515; border: 1px solid #222; border-radius: 15px; padding: 12px 8px; text-align: center; position: relative; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; height: 100px; box-sizing: border-box; }
        .label { font-size: 0.6rem; color: #555; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; }
        .rank-badge { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; font-weight: 900; padding: 2px 6px; border-radius: 50px; display: none; }
        .value { font-size: 0.78rem; font-weight: 700; line-height: 1.2; color: #fff; word-break: keep-all; }

        .btn-draw { margin-top: 30px; padding: 18px 80px; font-size: 1.4rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; }
        .rolling { opacity: 0.2; filter: blur(3px); }

        /* 하단 데이터 리스트 스타일 */
        .data-viewer { margin-top: 50px; width: 100%; max-width: 1100px; background: #111; padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .data-viewer h2 { font-size: 1.2rem; color: #fff; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px; margin-bottom: 20px; }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; }
        .data-column h3 { font-size: 0.9rem; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        .data-list { font-size: 0.75rem; line-height: 1.6; color: #aaa; max-height: 400px; overflow-y: auto; padding-right: 10px; }
        .data-item { border-bottom: 1px solid #222; padding: 4px 0; display: flex; justify-content: space-between; }
        .rank-S-txt { color: var(--s-rank); }
        .rank-A-txt { color: #fff; }

        /* 스크롤바 커스텀 */
        .data-list::-webkit-scrollbar { width: 4px; }
        .data-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .rank-S { background: var(--s-rank); color: #000; }
        .text-S { color: var(--s-rank); }
    </style>
</head>
<body>
    <div class="header"><h1>ROAD BIKE ROSTER</h1></div>
    
    <div id="total-rank" class="total-rank-box">
        <div class="total-rank-value" id="rank-val">-</div>
        <div id="rank-desc" class="total-rank-desc">-</div>
    </div>

    <div class="grid" id="main-grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">Frame</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-g"><div class="rank-badge" id="r-g"></div><div class="label">Groupset</div><div class="value" id="g">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">Wheelset</div><div class="value" id="w">---</div></div>
        <div class="card"><div class="label">Saddle</div><div class="value" id="s">---</div></div>
        <div class="card"><div class="label">Tire</div><div class="value" id="t">---</div></div>
        <div class="card"><div class="label">Pedal</div><div class="value" id="p">---</div></div>
    </div>

    <button class="btn-draw" onclick="run()">DRAFT START</button>

            <div class="data-column">

                <div id="list-w" class="data-list"></div>
            </div>
            <div class="data-column">
                <h3>Groupset (<span id="count-g">0</span>)</h3>
                <div id="list-g" class="data-list"></div>
            </div>
        </div>
    </div>

    		{n:"Partington R-Series MKII", r:"S"}, {n:"Syncros Capital SL 40", r:"S"}, {n:"DT Swiss ARC 1100 DICUT 50", r:"S"},

            ],

            t: ["Continental GP5000 S TR", "Vittoria Corsa PRO", "Pirelli P ZERO Race"],
            p: ["Shimano Dura-Ace PD-R9100", "Look Keo Blade Carbon Ti", "Wahoo Speedplay Zero"]
        };

        // 페이지 로드 시 하단 리스트 생성
        window.onload = function() {
            renderList('f', 'list-f', 'count-f');
            renderList('w', 'list-w', 'count-w');
            renderList('g', 'list-g', 'count-g');
        };

        function renderList(type, listId, countId) {
            const listEl = document.getElementById(listId);
            const countEl = document.getElementById(countId);
            const items = data[type];
            
            countEl.innerText = items.length;
            listEl.innerHTML = items.map(item => `
                <div class="data-item">
                    <span class="${item.r === 'S' ? 'rank-S-txt' : 'rank-A-txt'}">${item.n}</span>
                    <span style="font-weight:900; opacity:0.5;">${item.r}</span>
                </div>
            `).join('');
        }

        // ... 기존 run(), showResult() 함수들 유지 ...
        function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            document.querySelectorAll('.rank-badge').forEach(el => el.style.display = 'none');
            document.getElementById('total-rank').style.display = 'none';
            let count = 0;
            const timer = setInterval(() => {
                const f = data.f[Math.floor(Math.random()*data.f.length)];
                const g = data.g[Math.floor(Math.random()*data.g.length)];
                const w = data.w[Math.floor(Math.random()*data.w.length)];
                document.getElementById('f').innerText = f.n;
                document.getElementById('g').innerText = g.n;
                document.getElementById('w').innerText = w.n;
                document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)];
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];
                document.querySelectorAll('.value').forEach(v => v.classList.add('rolling'));
                count++;
                if(count > 25) {
                    clearInterval(timer);
                    btn.disabled = false;
                    document.querySelectorAll('.rolling').forEach(v => v.classList.remove('rolling'));
                    showResult(f, g, w);
                }
            }, 60);
        }

        function showResult(f, g, w) {
            const parts = {f, g, w};
            let score = 0;
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };
            for(let key in parts) {
                const rankCode = parts[key].r || "C";
                const badge = document.getElementById('r-' + key);
                badge.innerText = rankCode;
                badge.className = 'rank-badge rank-' + rankCode;
                badge.style.display = 'block';
                score += scoreMap[rankCode];
            }
            const avg = score / 3;
            let finalRank = avg >= 3.7 ? "S" : avg >= 3.0 ? "A" : avg >= 2.0 ? "B" : "C";
            document.getElementById('rank-val').innerText = finalRank + " CLASS";
            document.getElementById('rank-val').className = 'total-rank-value text-' + finalRank;
            document.getElementById('rank-desc').innerText = finalRank === "S" ? "🏆 천상계 기함!" : "🚀 상급 레이싱!";
            document.getElementById('total-rank').style.display = 'block';
        }
    </script>

</html>
