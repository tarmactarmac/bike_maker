<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Road Bike Roster Draft</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; color: var(--primary); margin: 0; text-shadow: 0 0 15px rgba(255,62,62,0.3); }
        .total-rank-box { margin-bottom: 20px; padding: 15px 40px; border-radius: 15px; background: #1a1a1a; border: 2px solid #333; font-weight: 900; font-size: 1.5rem; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background: #151515; border: 1px solid #222; border-radius: 20px; padding: 20px; text-align: center; position: relative; transition: 0.3s; }
        .card.active { border-color: var(--primary); }
        .label { font-size: 0.7rem; color: #888; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 10px; }
        .rank-badge { position: absolute; top: 10px; right: 10px; font-size: 0.8rem; font-weight: 900; padding: 2px 8px; border-radius: 4px; display: none; }
        .value { font-size: 1.1rem; font-weight: 700; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        .btn-draw { margin-top: 40px; padding: 20px 80px; font-size: 1.3rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.2s; }
        .btn-draw:hover { transform: scale(1.05); background: #ff5e5e; }
        .rolling { opacity: 0.4; filter: blur(1px); }
        
        /* 등급별 색상 */
        .rank-S { color: var(--s-rank); border: 1px solid var(--s-rank); }
        .rank-A { color: var(--a-rank); border: 1px solid var(--a-rank); }
        .rank-B { color: var(--b-rank); border: 1px solid var(--b-rank); }
        .rank-C { color: var(--c-rank); border: 1px solid var(--c-rank); }
    </style>
</head>
<body>
    <div class="header">
        <h1>ROSTER DRAFT v2</h1>
        <p>상위 부품 리스트 기반 랜덤 드래프트</p>
    </div>

    <div id="total-rank" class="total-rank-box">최종 등급: <span id="rank-val">-</span></div>

    <div class="grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">FRAME</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-g"><div class="rank-badge" id="r-g"></div><div class="label">GROUPSET</div><div class="value" id="g">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">WHEELSET</div><div class="value" id="w">---</div></div>
        <div class="card"><div class="label">SADDLE</div><div class="value" id="s">---</div></div>
        <div class="card"><div class="label">TIRE</div><div class="value" id="t">---</div></div>
        <div class="card"><div class="label">PEDAL</div><div class="value" id="p">---</div></div>
    </div>

    <button class="btn-draw" onclick="run()">DRAFT START</button>

    <script>
        const data = {
            f: [
                {n:"S-Works Tarmac SL8", r:"S"}, {n:"Trek Madone SLR Gen 7", r:"S"}, {n:"Canyon Aeroad CFR", r:"S"}, {n:"Pinarello Dogma F", r:"S"}, {n:"Cervelo S5 V3", r:"S"}, {n:"Colnago V4Rs", r:"S"},
                {n:"Giant Propel Advanced SL", r:"A"}, {n:"Specialized Tarmac SL7", r:"A"}, {n:"Canyon Ultimate SLX", r:"A"}, {n:"BMC Teammachine SLR01", r:"A"}, {n:"Scott Foil RC", r:"A"}, {n:"Factor OSTRO VAM", r:"A"},
                {n:"Giant TCR Advanced Pro", r:"B"}, {n:"Merida Reacto 8000", r:"B"}, {n:"Bianchi Aria", r:"B"}, {n:"Canyon Endurace CF", r:"B"}, {n:"Trek Emonda SL", r:"B"}, {n:"Cannondale SuperSix EVO", r:"B"},
                {n:"Giant Content", r:"C"}, {n:"Merida Scultura 400", r:"C"}, {n:"Specialized Allez", r:"C"}, {n:"Trek Domane AL", r:"C"}, {n:"Bianchi Via Nirone 7", r:"C"}
                // ... 프레임 데이터 100개급 확장 가능 (생략)
            ],
            g: [
                {n:"Dura-Ace R9270 Di2", r:"S"}, {n:"SRAM RED AXS (2024)", r:"S"}, {n:"Campagnolo Super Record Wireless", r:"S"},
                {n:"Ultegra R8170 Di2", r:"A"}, {n:"SRAM Force AXS", r:"A"}, {n:"Dura-Ace R9170 Di2", r:"A"},
                {n:"Shimano 105 R7170 Di2", r:"B"}, {n:"SRAM Rival AXS", r:"B"}, {n:"Ultegra R8070 Di2", r:"B"},
                {n:"Shimano 105 Mechanical", r:"C"}, {n:"SRAM Apex", r:"C"}, {n:"Shimano Tiagra", r:"C"}
            ],
            w: [
                {n:"Roval Rapide CLX II", r:"S"}, {n:"Zipp 454 NSW", r:"S"}, {n:"Bora Ultra WTO 45", r:"S"}, {n:"Enve SES 4.5", r:"S"},
                {n:"Zipp 404 Firecrest", r:"A"}, {n:"Shimano Dura-Ace C50", r:"A"}, {n:"Cadex 50 Ultra", r:"A"}, {n:"DT Swiss ARC 1100", r:"A"},
                {n:"Roval C38", r:"B"}, {n:"Hunt 50 Carbon Aero", r:"B"}, {n:"Shimano 105 Carbon", r:"B"}, {n:"FarSports Ventoux", r:"B"},
                {n:"Shimano RS171", r:"C"}, {n:"Mavic Aksium", r:"C"}, {n:"DT Swiss P1800", r:"C"}
            ],
            s: ["S-Works Power Mirror", "Fizik Vento Argo R1", "Selle Italia SLR Boost", "S-Works Romin EVO", "Prologo Scratch M5", "Fizik Antares Versus", "Selle SMP Dynamic", "Bontrager Aeolus Pro", "Specialized Power Expert", "Fabric Line-S", "Brooks Cambium C13", "San Marco Aspide", "Syncros Belcarra", "PRO Stealth Performance", "Fizik Aliante R3", "Selle Italia Flite", "Astute Skyline", "Tioga Spyder", "S-Works Phenom", "Ritchey WCS", "Ergon SR Pro", "Giant Fleet SL", "Canyon VCLS", "Cadex Boost", "Selle Italia Novus", "Fizik Terra Argo", "Specialized Bridge", "Bontrager Verse", "S-Works Sitero", "ISM PN 3.0", "Selle Royal Respiro", "Fabric Scoop", "WTB Silverado", "Terry Fly", "SQlab 612", "Prologo Dimension", "Selle Italia Diva", "Fizik Luce", "Specialized Mimic", "Selle SMP Glider", "Brooks Swift", "San Marco Concor", "Deda Elementi Superleggera", "Zipp Service Course", "Thomson Masterpiece", "Enve 2.0", "3T Zero25", "Look LS1", "ControlTech Cougar", "Prologo Nago Evo"],
            t: ["Continental GP5000 S TR", "Vittoria Corsa Next", "Pirelli P ZERO Race", "Schwalbe Pro One TLE", "Goodyear Eagle F1", "Specialized Turbo Cotton", "Michelin Power Cup", "Bontrager R3 Hard-Case", "Zipp Tangente Speed", "Veloflex Corsa", "Challenge Strada", "Donnelly LGG", "Maxxis High Road", "Panaracer Agilest", "Tufo Comtura Duo", "Kenda Valkyrie", "Hutchinson Fusion 5", "Mavic Yksion Pro", "IRC Formula Pro", "CST Recourse", "Ritchey WCS Alpine JB", "Wahoo Speedplay", "Enve SES Tire", "Specialized S-Works Turbo", "Vredestein Fortezza", "Continental Ultra Sport", "Vittoria Zaffiro Pro", "Schwalbe Lugano", "Pirelli P7", "Michelin Dynamic Sport"],
            p: ["Shimano Dura-Ace PD-R9100", "Shimano Ultegra PD-R8000", "Shimano 105 PD-R7000", "SRAM Time XPRO 15", "Look Keo Blade Carbon Ceramic", "Look Keo Classic 3", "Wahoo Speedplay Zero", "Wahoo Speedplay Nano", "Garmin Rally RS200", "Favero Assioma Duo"],
            size: ["26C", "28C", "30C"]
        };

        function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            document.querySelectorAll('.rank-badge').forEach(el => el.style.display = 'none');
            document.getElementById('total-rank').style.display = 'none';

            let count = 0;
            const timer = setInterval(() => {
                // 핵심 3종 랜덤 (등급 포함)
                const f_res = data.f[Math.floor(Math.random()*data.f.length)];
                const g_res = data.g[Math.floor(Math.random()*data.g.length)];
                const w_res = data.w[Math.floor(Math.random()*data.w.length)];

                document.getElementById('f').innerText = f_res.n;
                document.getElementById('g').innerText = g_res.n;
                document.getElementById('w').innerText = w_res.n;

                // 일반 파츠 랜덤
                document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)] + " (" + data.size[Math.floor(Math.random()*data.size.length)] + ")";
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];

                count++;
                if(count > 25) {
                    clearInterval(timer);
                    btn.disabled = false;
                    showResult(f_res, g_res, w_res);
                }
            }, 60);
        }

        function showResult(f, g, w) {
            // 등급 뱃지 표시
            const parts = {f, g, w};
            let score = 0;
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };

            for(let key in parts) {
                const el = document.getElementById('r-' + key);
                el.innerText = parts[key].r;
                el.className = 'rank-badge rank-' + parts[key].r;
                el.style.display = 'block';
                score += scoreMap[parts[key].r];
            }

            // 최종 등급 계산 (평균치 기반)
            let totalRank = "C";
            const avg = score / 3;
            if (avg >= 3.7) totalRank = "S";
            else if (avg >= 3.0) totalRank = "A";
            else if (avg >= 2.0) totalRank = "B";

            const rankVal = document.getElementById('rank-val');
            rankVal.innerText = totalRank;
            rankVal.className = 'rank-' + totalRank;
            document.getElementById('total-rank').style.display = 'block';
        }
    </script>
</body>
</html>
