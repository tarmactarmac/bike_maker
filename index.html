<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Road Bike Draft</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.2rem; color: var(--primary); margin: 0; letter-spacing: -1px; text-transform: uppercase; }
        .total-rank-box { margin: 20px 0; padding: 15px 50px; border-radius: 100px; background: #1a1a1a; border: 2px solid #333; font-weight: 900; font-size: 1.8rem; display: none; box-shadow: 0 0 20px rgba(255,207,64,0.2); transition: 0.5s; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 1100px; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(1, 1fr); } }
        .card { background: #151515; border: 1px solid #222; border-radius: 20px; padding: 25px 15px; text-align: center; position: relative; overflow: hidden; }
        .card.active { border-color: var(--primary); }
        .label { font-size: 0.7rem; color: #888; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 12px; text-transform: uppercase; }
        .rank-badge { position: absolute; top: 15px; right: 15px; font-size: 0.85rem; font-weight: 900; width: 26px; height: 26px; border-radius: 50%; display: none; line-height: 26px; text-align: center; z-index: 2; }
        .value { font-size: 1.1rem; font-weight: 700; min-height: 70px; display: flex; align-items: center; justify-content: center; line-height: 1.3; color: #eee; }
        .btn-draw { margin-top: 40px; padding: 20px 80px; font-size: 1.4rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,62,62,0.3); }
        .btn-draw:hover { transform: scale(1.05); background: #ff5e5e; }
        .rolling { opacity: 0.3; filter: blur(2px); transform: scale(0.95); }
        .rank-S { color: var(--s-rank); border: 1.5px solid var(--s-rank); box-shadow: 0 0 10px rgba(255,207,64,0.4); }
        .rank-A { color: var(--a-rank); border: 1.5px solid var(--a-rank); }
        .rank-B { color: var(--b-rank); border: 1.5px solid var(--b-rank); }
        .rank-C { color: var(--c-rank); border: 1.5px solid var(--c-rank); }
        .text-S { color: var(--s-rank); text-shadow: 0 0 10px var(--s-rank); }
        .text-A { color: var(--a-rank); } .text-B { color: var(--b-rank); } .text-C { color: var(--c-rank); }
    </style>
</head>
<body>
    <div class="header"><h1>ROAD BIKE DRAFT</h1></div>
    <div id="total-rank" class="total-rank-box">FINAL RANK: <span id="rank-val">-</span></div>
    <div class="grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">Frame</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-g"><div class="rank-badge" id="r-g"></div><div class="label">Groupset</div><div class="value" id="g">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">Wheelset</div><div class="value" id="w">---</div></div>
        <div class="card"><div class="label">Saddle</div><div class="value" id="s">---</div></div>
        <div class="card"><div class="label">Tire</div><div class="value" id="t">---</div></div>
        <div class="card"><div class="label">Pedal</div><div class="value" id="p">---</div></div>
    </div>
    <button class="btn-draw" onclick="run()">DRAFT START</button>

    <script>
        const data = {
            f: [
                {n:"S-Works Tarmac SL8", r:"S"}, {n:"Trek Madone SLR Gen 7", r:"S"}, {n:"Canyon Aeroad CFR", r:"S"}, {n:"Pinarello Dogma F", r:"S"}, {n:"Cervelo S5 V3", r:"S"}, {n:"Colnago V4Rs", r:"S"}, {n:"Factor OSTRO VAM", r:"S"}, {n:"S-Works Aethos", r:"S"}, {n:"Cervelo R5", r:"S"}, {n:"Cannondale SuperSix EVO Hi-MOD", r:"S"}, {n:"BMC Teammachine SLR01", r:"S"}, {n:"Scott Foil RC Pro", r:"S"}, {n:"Wilier Filante SLR", r:"S"}, {n:"Look 795 Blade RS", r:"S"}, {n:"Colnago C68", r:"S"}, {n:"Giant Propel Advanced SL", r:"S"}, {n:"Enve Melee", r:"S"}, {n:"Factor O2 VAM", r:"S"}, {n:"Ridley Noah Fast", r:"S"}, {n:"Bianchi Oltre RC", r:"S"},
                {n:"Giant TCR Advanced SL", r:"A"}, {n:"Canyon Ultimate SLX", r:"A"}, {n:"Specialized Tarmac SL7 Pro", r:"A"}, {n:"Trek Emonda SLR", r:"A"}, {n:"Bianchi Specialissima", r:"A"}, {n:"Merida Reacto Team", r:"A"}, {n:"Orbea Orca OMX", r:"A"}, {n:"Cannondale SystemSix Hi-MOD", r:"A"}, {n:"BMC Roadmachine 01", r:"A"}, {n:"Chapter2 TOA", r:"A"}, {n:"Wilier 0 SLR", r:"A"}, {n:"Basso Diamante SV", r:"A"}, {n:"Storck Aerfast 4", r:"A"}, {n:"De Rosa Merak", r:"A"}, {n:"Dare VSRu", r:"A"}, {n:"Eddy Merckx 525", r:"A"}, {n:"Pinarello Prince FX", r:"A"}, {n:"Cube Litening C:68X", r:"A"}, {n:"Winspace T1500", r:"A"}, {n:"Felt AR Advanced", r:"A"},
                {n:"Giant TCR Advanced Pro", r:"B"}, {n:"Canyon Aeroad CF SL", r:"B"}, {n:"Specialized Tarmac SL6", r:"B"}, {n:"Trek Madone SL", r:"B"}, {n:"Merida Reacto 7000", r:"B"}, {n:"Bianchi Aria", r:"B"}, {n:"Scott Addict", r:"B"}, {n:"Orbea Orca OMR", r:"B"}, {n:"Focus Izalco Max", r:"B"}, {n:"Rose Xlite 04", r:"B"}, {n:"Canyon Endurace CF", r:"B"}, {n:"Cinelli Pressure", r:"B"}, {n:"Ceepo Mamba-R", r:"B"}, {n:"Pardus Super Sport", r:"B"}, {n:"Trigon RC01", r:"B"}, {n:"SwiftCarbon Attack", r:"B"}, {n:"Java Siluro 6", r:"B"}, {n:"Elves Vanyar Pro", r:"B"}, {n:"Gusto Ranger Evo", r:"B"}, {n:"Polygon Strattos S8", r:"B"},
                {n:"Giant Contend AR", r:"C"}, {n:"Merida Scultura 400", r:"C"}, {n:"Specialized Allez Sprint", r:"C"}, {n:"Trek Domane AL", r:"C"}, {n:"Bianchi Via Nirone 7", r:"C"}, {n:"Canyon Endurace AL", r:"C"}, {n:"Scott Speedster", r:"C"}, {n:"Cannondale CAAD13", r:"C"}, {n:"Fuji Roubaix", r:"C"}, {n:"Twitter Sniper 2.0", r:"C"}, {n:"Savane Phantom", r:"C"}, {n:"Triban RC 520", r:"C"}, {n:"Java Fuoco", r:"C"}, {n:"Black-Star Carbon", r:"C"}, {n:"Cell Lapa", r:"C"}
            ],
            g: [
                {n:"Dura-Ace R9270 Di2", r:"S"}, {n:"SRAM RED AXS (2024)", r:"S"}, {n:"Campagnolo Super Record Wireless", r:"S"},
                {n:"Ultegra R8170 Di2", r:"A"}, {n:"SRAM Force AXS", r:"A"}, {n:"Dura-Ace R9170 Di2", r:"A"},
                {n:"Shimano 105 R7170 Di2", r:"B"}, {n:"SRAM Rival AXS", r:"B"}, {n:"Ultegra R8070 Di2", r:"B"},
                {n:"Shimano 105 Mechanical", r:"C"}, {n:"SRAM Apex", r:"C"}, {n:"Shimano Tiagra", r:"C"}
            ],
            w: [
                {n:"Roval Rapide CLX 3", r:"S"}, {n:"Roval Alpinist CLX 3", r:"S"}, {n:"Scope Artech 4", r:"S"}, {n:"Scope Artech 6", r:"S"}, {n:"Zipp 454 NSW", r:"S"}, {n:"Zipp 353 NSW", r:"S"}, {n:"Princeton Wake 7580", r:"S"}, {n:"Enve SES 4.5 New Gen", r:"S"}, {n:"Bora Ultra WTO 45", r:"S"}, {n:"Shimano Dura-Ace C50 R9270", r:"S"}, {n:"Cadex Max 40", r:"S"}, {n:"DT Swiss ARC 1100", r:"S"}, {n:"Lightweight Obermayer", r:"S"}, {n:"Syncros Capital SL", r:"S"}, {n:"Vision Metron 60 SL", r:"S"}, {n:"Reserve 52/63", r:"S"}, {n:"Corima MCC DX", r:"S"}, {n:"Black Inc Five", r:"S"}, {n:"Zipp 858 NSW", r:"S"}, {n:"Princeton Peak 4550", r:"S"},
                {n:"Scope R5 Disc", r:"A"}, {n:"Scope R4 Disc", r:"A"}, {n:"Bontrager Aeolus RSL 51", r:"A"}, {n:"Zipp 404 Firecrest", r:"A"}, {n:"Zipp 303 Firecrest", r:"A"}, {n:"DT Swiss ARC 1400", r:"A"}, {n:"Shimano Ultegra C50", r:"A"}, {n:"HED Vanquish RC6", r:"A"}, {n:"Mavic Cosmic SLR 45", r:"A"}, {n:"Enve Foundation 45", r:"A"}, {n:"Roval Rapide CL II", r:"A"}, {n:"Winspace Hyper 50mm", r:"A"}, {n:"Aviav Adeon 50 Ceramic", r:"A"}, {n:"FarSports Ventoux S5", r:"A"}, {n:"Fulcrum Speed 55 DB", r:"A"}, {n:"Vision SC 55", r:"A"}, {n:"FFWD RYOT 55", r:"A"}, {n:"Hunt 54 Aero", r:"A"}, {n:"Cadex 36 Disc", r:"A"}, {n:"Token Konax Pro", r:"A"},
                {n:"Scope S4 Disc", r:"B"}, {n:"Scope S5 Disc", r:"B"}, {n:"Zipp 303 S", r:"B"}, {n:"Shimano 105 Carbon C46", r:"B"}, {n:"Roval C38 Disc", r:"B"}, {n:"Hunt 50 Carbon Wide", r:"B"}, {n:"DT Swiss P1800", r:"B"}, {n:"Mavic Cosmic SL 45", r:"B"}, {n:"Giant SLR 1 50", r:"B"}, {n:"Winspace Lun Road", r:"B"}, {n:"Yoeleo SAT C50", r:"B"}, {n:"ICAN FL50", r:"B"}, {n:"Superteam 50mm Carbon", r:"B"}, {n:"Campagnolo Scirocco", r:"B"}, {n:"Vision Team 35 Disc", r:"B"}, {n:"FFWD Tyro", r:"B"}, {n:"Scribe Aero Wide 50", r:"B"}, {n:"Parcours Grimpeur", r:"B"}, {n:"Fulcrum Racing 4", r:"B"}, {n:"Reynolds AR58", r:"B"},
                {n:"Shimano RS171", r:"C"}, {n:"Mavic Aksium Disc", r:"C"}, {n:"DT Swiss R470", r:"C"}, {n:"Giant SR2 Disc", r:"C"}, {n:"Vision Team 30", r:"C"}, {n:"Fulcrum Racing 6", r:"C"}, {n:"Bontrager Paradigm", r:"C"}, {n:"Maddux RD 3.0", r:"C"}
            ],
            s: ["S-Works Power Mirror", "Fizik Vento Argo R1", "Selle Italia SLR Boost", "Prologo Scratch M5", "Fizik Antares Versus", "Bontrager Aeolus Pro", "Specialized Power Expert", "Brooks Cambium C13", "PRO Stealth Performance", "Cadex Boost"],
            t: ["Continental GP5000 S TR", "Vittoria Corsa Next", "Pirelli P ZERO Race", "Schwalbe Pro One TLE", "Goodyear Eagle F1", "Specialized Turbo Cotton", "Michelin Power Cup", "Bontrager R3", "Panaracer Agilest", "Maxxis High Road"],
            p: ["Shimano Dura-Ace PD-R9100", "Shimano Ultegra PD-R8000", "Shimano 105 PD-R7000", "Look Keo Blade Carbon", "Wahoo Speedplay Zero", "Garmin Rally RS200", "Favero Assioma Duo"],
            size: ["26C", "28C", "30C"]
        };

        function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            document.querySelectorAll('.rank-badge').forEach(el => el.style.display = 'none');
            document.getElementById('total-rank').style.display = 'none';
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));

            let count = 0;
            const timer = setInterval(() => {
                const f_res = data.f[Math.floor(Math.random()*data.f.length)];
                const g_res = data.g[Math.floor(Math.random()*data.g.length)];
                const w_res = data.w[Math.floor(Math.random()*data.w.length)];

                document.getElementById('f').innerText = f_res.n;
                document.getElementById('g').innerText = g_res.n;
                document.getElementById('w').innerText = w_res.n;
                document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)] + " (" + data.size[Math.floor(Math.random()*data.size.length)] + ")";
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];

                document.querySelectorAll('.value').forEach(v => v.classList.add('rolling'));

                count++;
                if(count > 25) {
                    clearInterval(timer);
                    btn.disabled = false;
                    document.querySelectorAll('.value').forEach(v => v.classList.remove('rolling'));
                    showResult(f_res, g_res, w_res);
                }
            }, 60);
        }

        function showResult(f, g, w) {
            const parts = {f, g, w};
            let score = 0;
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };

            for(let key in parts) {
                const badge = document.getElementById('r-' + key);
                badge.innerText = parts[key].r;
                badge.className = 'rank-badge rank-' + parts[key].r;
                badge.style.display = 'block';
                score += scoreMap[parts[key].r];
            }

            let totalRank = "C";
            const avg = score / 3;
            if (avg >= 3.7) totalRank = "S";
            else if (avg >= 3.0) totalRank = "A";
            else if (avg >= 2.0) totalRank = "B";

            const rankVal = document.getElementById('rank-val');
            rankVal.innerText = totalRank;
            rankVal.className = 'text-' + totalRank;
            document.getElementById('total-rank').style.display = 'block';
            document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
        }
    </script>
</body>
</html>
