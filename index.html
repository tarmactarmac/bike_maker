<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Bike Draft - FIFA Pack Edition</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #000; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden; }
        
        .header h1 { font-size: 1.6rem; color: var(--primary); margin: 20px 0; text-transform: uppercase; font-weight: 900; letter-spacing: -1px; text-shadow: 0 0 10px rgba(255, 62, 62, 0.5); }

        .total-rank-box { margin-bottom: 20px; padding: 15px 30px; border-radius: 20px; background: #1a1a1a; border: 2px solid #333; text-align: center; display: none; width: 100%; max-width: 500px; box-sizing: border-box; }
        .total-rank-value { font-size: 2.2rem; font-weight: 900; margin-bottom: 5px; line-height: 1; }
        .total-rank-desc { font-size: 0.9rem; color: var(--primary); font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 1100px; }
        .card { background: linear-gradient(145deg, #151515, #0a0a0a); border: 1px solid #222; border-radius: 15px; padding: 12px 8px; text-align: center; position: relative; transition: all 0.3s; display: flex; flex-direction: column; justify-content: center; height: 115px; box-sizing: border-box; overflow: hidden; }
        .card.active { border-color: #444; background: #111; }
        .card.s-win { border-color: var(--s-rank); box-shadow: 0 0 20px rgba(255, 207, 64, 0.3); animation: shake 0.4s ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px) rotate(-1deg); }
            75% { transform: translateX(4px) rotate(1deg); }
        }

        .label { font-size: 0.6rem; color: #555; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .brand-text { font-size: 0.65rem; color: #888; font-weight: 600; margin-bottom: 2px; text-transform: uppercase; display: block; }
        .value { font-size: 0.8rem; font-weight: 700; line-height: 1.2; color: #fff; word-break: keep-all; min-height: 3.5em; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .rank-badge { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; font-weight: 900; padding: 2px 6px; border-radius: 50px; display: none; z-index: 10; }
        .rolling { opacity: 0.4; filter: blur(2px); }
        .text-S { color: var(--s-rank); font-weight: 900; text-shadow: 0 0 10px rgba(255, 207, 64, 0.5); }
        .blink-text { animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { opacity: 0.7; } to { opacity: 1; } }

        .btn-draw { margin-top: 30px; padding: 18px 80px; font-size: 1.5rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,62,62,0.3); }
        .btn-draw:disabled { background: #333; cursor: not-allowed; box-shadow: none; }

        .rank-S { background: var(--s-rank); color: #000; box-shadow: 0 0 10px var(--s-rank); }
        .rank-A { background: var(--a-rank); color: #000; }
        .rank-B { background: var(--b-rank); color: #fff; }
        .rank-C { background: var(--c-rank); color: #fff; }

        .data-viewer { margin-top: 50px; width: 100%; max-width: 1100px; padding: 0 10px; box-sizing: border-box; }
        .roster-toggle-btn { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #888; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .roster-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #080808; border-radius: 0 0 12px 12px; }
        .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .data-list { font-size: 0.7rem; color: #aaa; max-height: 300px; overflow-y: auto; border-top: 1px solid #222; }
        .data-item { display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; padding: 6px 0; }
        .rank-S-txt { color: var(--s-rank); font-weight: bold; }

        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } .data-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header"><h1>너만의 자전거로 너만의 라이딩을 해</h1></div>
    
    <div id="total-rank" class="total-rank-box">
        <div class="total-rank-value" id="rank-val">-</div>
        <div id="rank-desc" class="total-rank-desc">-</div>
    </div>

    <div class="grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">Frame</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">Wheelset</div><div class="value" id="w">---</div></div>

        <div class="card" id="card-t"><div class="label">Tire</div><div class="value" id="t">---</div></div>
        <div class="card" id="card-p"><div class="label">Pedal</div><div class="value" id="p">---</div></div>
    </div>

            t: ["Continental GP5000 S TR", "Continental GP5000 AS TR", "Vittoria Corsa PRO", "Vittoria Corsa Next", "Pirelli P ZERO Race TLR", "Pirelli P ZERO Race RS", "Schwalbe Pro One TLE", "Specialized Turbo Cotton", "Specialized S-Works Turbo", "Bontrager R3 Hard-Case", "Goodyear Eagle F1", "Michelin Power Cup", "Panaracer Agilest TLE", "Veloflex Corsa RACE", "Challenge Strada Bianca", "Pirelli P7 Sport"],

        function setBadge(id, rank, hero) {
            const badge = document.getElementById('r-' + id);
            if(!badge) return;
            badge.innerText = hero ? "⭐ " + hero.split(' ')[0] : rank;
            badge.className = 'rank-badge rank-' + rank;
            badge.style.display = 'block';
        }

        function startRolling(id, type) {
            return setInterval(() => {
                const randomItem = data[type][Math.floor(Math.random() * data[type].length)];
                const el = document.getElementById(id);
                if (type === 's' || type === 't' || type === 'p') {
                    el.innerText = randomItem;
                } else {
                    el.innerHTML = `<span class="brand-text">${randomItem.b}</span><span>${randomItem.n}</span>`;
                }
            }, 60);
        }

        async function finalizeCard(cardId, valId, item, hero) {
            const card = document.getElementById(cardId);
            const el = document.getElementById(valId);
            el.classList.remove('rolling');
            
            if (item.r === 'S') {
                card.classList.add('s-win');
                // 연출: 등급 유지 -> 브랜드 추가 -> 이름 추가
                el.innerHTML = `<span class="text-S blink-text">RANK: S</span>`;
                await new Promise(r => setTimeout(r, 700));
                el.innerHTML = `<span class="text-S">RANK: S</span><span class="brand-text" style="color:var(--s-rank)">${item.b}</span>`;
                await new Promise(r => setTimeout(r, 700));
                el.innerHTML = `<span class="text-S">RANK: S</span><span class="brand-text" style="color:var(--s-rank)">${item.b}</span><span class="text-S">${item.n}</span>`;
            } else {
                el.innerHTML = `<span class="brand-text">${item.b}</span><span style="color:#eee">[${item.r}] ${item.n}</span>`;
            }
            setBadge(valId, item.r, hero);
        }

        async function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            
            document.querySelectorAll('.rank-badge').forEach(e => e.style.display = 'none');
            document.querySelectorAll('.card').forEach(e => {e.classList.remove('s-win', 'active'); e.querySelector('.value').classList.add('rolling');});
            document.getElementById('total-rank').style.display = 'none';

            const timers = {
                f: startRolling('f', 'f'),
                w: startRolling('w', 'w'),
                g: startRolling('g', 'g'),
                s: startRolling('s', 's'),
                t: startRolling('t', 't'),
                p: startRolling('p', 'p')
            };

            const resF = data.f[Math.floor(Math.random()*data.f.length)];
            const resW = data.w[Math.floor(Math.random()*data.w.length)];
            const resG = data.g[Math.floor(Math.random()*data.g.length)];
            const resS = data.s[Math.floor(Math.random()*data.s.length)];
            const resT = data.t[Math.floor(Math.random()*data.t.length)] + " (" + data.size[Math.floor(Math.random()*data.size.length)] + ")";
            const resP = data.p[Math.floor(Math.random()*data.p.length)];

            let hero = null;
            const fn = resF.n; const wn = resW.n;
            if ((fn.includes("V4Rs") || fn.includes("V5Rs") || fn.includes("C68")) && (wn.includes("SES") || wn.includes("PRO 4.5"))) hero = "Tadej Pogačar";
            else if ((fn.includes("S5") || fn.includes("R5")) && (wn.includes("40/44") || wn.includes("52/63") || wn.includes("34/37"))) hero = "Jonas Vingegaard";
            else if (fn.includes("Tarmac SL8") && wn.includes("Rapide CLX III")) hero = "Remco Evenepoel";
            else if (fn.includes("Aeroad CFR") && (wn.includes("Dura-Ace") || wn.includes("C50") || wn.includes("C60"))) hero = "M. van der Poel";
            else if (fn.includes("Filante SLR") && (wn.includes("Metron") || wn.includes("Vanquish"))) hero = "Mark Cavendish";
            else if (fn.includes("Dogma F") && (wn.includes("Wake") || wn.includes("Peak") || wn.includes("Dura-Ace"))) hero = "Tom Pidcock";

            // 순차적 정지 연출 시작
            await new Promise(r => setTimeout(r, 1200));
            clearInterval(timers.f);
            await finalizeCard('card-f', 'f', resF, (hero && (fn.includes("V4Rs")||fn.includes("V5Rs")||fn.includes("C68")||fn.includes("S5")||fn.includes("R5")||fn.includes("Tarmac")||fn.includes("Aeroad")||fn.includes("Filante")||fn.includes("Dogma"))) ? hero : null);

            await new Promise(r => setTimeout(r, 600));
            clearInterval(timers.w);
            await finalizeCard('card-w', 'w', resW, (hero && (wn.includes("SES")||wn.includes("PRO 4.5")||wn.includes("40/44")||wn.includes("52/63")||wn.includes("Rapide")||wn.includes("Dura-Ace")||wn.includes("Metron")||wn.includes("Wake"))) ? hero : null);

            await new Promise(r => setTimeout(r, 600));
            clearInterval(timers.g);
            await finalizeCard('card-g', 'g', resG, null);

            await new Promise(r => setTimeout(r, 400));
            clearInterval(timers.s); clearInterval(timers.t); clearInterval(timers.p);
            
            document.getElementById('s').innerText = resS;
            document.getElementById('t').innerText = resT;
            document.getElementById('p').innerText = resP;
            document.querySelectorAll('.value.rolling').forEach(v => v.classList.remove('rolling'));

            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };
            const avg = (scoreMap[resF.r] + scoreMap[resG.r] + scoreMap[resW.r]) / 3;
            const finalRank = avg >= 3.7 ? "S" : avg >= 3.0 ? "A" : avg >= 2.0 ? "B" : "C";
            
            const rVal = document.getElementById('rank-val');
            if (hero) {
                rVal.innerText = "HERO CLASS"; rVal.style.color = "var(--s-rank)";
                document.getElementById('rank-desc').innerText = `🔥 LEGENDARY: ${hero} SETTING!`;
            } else {
                rVal.innerText = finalRank + " CLASS"; rVal.style.color = finalRank === 'S' ? "var(--s-rank)" : "#fff";
                document.getElementById('rank-desc').innerText = finalRank === 'S' ? "🏆 천상계 기함 세팅 완료!" : "🚴 즐거운 라이딩 되세요!";
            }
            document.getElementById('total-rank').style.display = 'block';
            document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
            
            btn.disabled = false;
        }

        function toggleRoster() {
            const content = document.getElementById('roster-content');
            content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
        }

        function init() {
            const configs = [{k:'f', l:'list-f', c:'count-f'}, {k:'w', l:'list-w', c:'count-w'}, {k:'g', l:'list-g', c:'count-g'}];
            configs.forEach(conf => {
                document.getElementById(conf.c).innerText = data[conf.k].length;
                document.getElementById(conf.l).innerHTML = data[conf.k].map(i => `<div class="data-item"><span class="${i.r==='S'?'rank-S-txt':''}">[${i.b}] ${i.n}</span><span>${i.r}</span></div>`).join('');
            });
        }
        window.onload = init;
    </script>
</body>
</html>
