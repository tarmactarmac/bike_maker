<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Road Bike Draft</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 40px 20px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; color: var(--primary); margin: 0; letter-spacing: -1px; text-transform: uppercase; font-weight: 900; }
        
        .total-rank-box { margin-bottom: 40px; padding: 30px 60px; border-radius: 30px; background: #1a1a1a; border: 2px solid #333; text-align: center; display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.5); animation: slideDown 0.5s ease-out; width: 100%; max-width: 600px; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .total-rank-label { font-size: 0.8rem; color: #888; margin-bottom: 10px; letter-spacing: 2px; }
        .total-rank-value { font-size: 2.8rem; font-weight: 900; margin-bottom: 10px; line-height: 1; }
        .total-rank-desc { font-size: 1.1rem; color: var(--primary); font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 1100px; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(1, 1fr); } }
        
        .card { background: #151515; border: 1px solid #222; border-radius: 28px; padding: 35px 20px; text-align: center; position: relative; transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: center; height: 160px; }
        .card.active { border-color: #444; background: #1c1c1c; }
        
        .label { font-size: 0.75rem; color: #666; font-weight: 800; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        .rank-badge { position: absolute; top: 18px; right: 20px; font-size: 0.7rem; font-weight: 900; padding: 5px 12px; border-radius: 50px; display: none; z-index: 5; white-space: nowrap; }
        
        .value { font-size: 1.25rem; font-weight: 800; line-height: 1.4; color: #fff; transition: 0.1s; word-break: keep-all; }
        
        .btn-draw { margin-top: 50px; padding: 22px 120px; font-size: 1.6rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(255,62,62,0.4); }
        .btn-draw:hover { transform: scale(1.05); background: #ff5e5e; }
        
        .rolling { opacity: 0.2; filter: blur(4px); transform: translateY(5px); }

        .rank-S { background: var(--s-rank); color: #000; box-shadow: 0 0 15px rgba(255,207,64,0.4); }
        .rank-A { background: var(--a-rank); color: #000; }
        .rank-B { background: var(--b-rank); color: #fff; }
        .rank-C { background: var(--c-rank); color: #fff; }
        .text-S { color: var(--s-rank); text-shadow: 0 0 15px rgba(255,207,64,0.5); }
        .text-A { color: var(--a-rank); }
    </style>
</head>
<body>
    <div class="header"><h1>ROAD BIKE DRAFT</h1></div>
    
    <div id="total-rank" class="total-rank-box">
        <div class="total-rank-label" id="top-label">CONGRATULATIONS!</div>
        <div class="total-rank-value" id="rank-val">-</div>
        <div id="rank-desc" class="total-rank-desc">-</div>
    </div>

    <div class="grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">Frame</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-g"><div class="rank-badge" id="r-g"></div><div class="label">Groupset</div><div class="value" id="g">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">Wheelset</div><div class="value" id="w">---</div></div>
        <div class="card"><div class="label">Saddle</div><div class="value" id="s">---</div></div>
        <div class="card"><div class="label">Tire</div><div class="value" id="t">---</div></div>
        <div class="card"><div class="label">Pedal</div><div class="value" id="p">---</div></div>
    </div>
    
    <button class="btn-draw" onclick="run()">DRAFT START</button>

    <script>
        const rankNames = { "S": "최상급 기함", "A": "상급 퍼포먼스", "B": "중급 가성비", "C": "입문용" };
        const finalDescriptions = {
            "S": "🏆 월드투어 프로팀 수준의 천상계 기함입니다!",
            "A": "🚀 동호인 상위 1%를 위한 강력한 레이싱 머신!",
            "B": "⚖️ 성능과 가격을 모두 잡은 합리적인 조합!",
            "C": "🚴 자전거의 즐거움을 알아가는 훌륭한 입문기!"
        };

        const data = {
            f: [
                {n:"Colnago V4Rs", r:"S"}, {n:"Cervelo S5 V3", r:"S"}, {n:"Specialized S-Works Tarmac SL8", r:"S"},
                {n:"Pinarello Dogma F", r:"S"}, {n:"Canyon Aeroad CFR", r:"S"}, {n:"Factor OSTRO VAM", r:"S"},
                {n:"Trek Madone SLR Gen 7", r:"S"}, {n:"BMC Teammachine SLR01", r:"S"}, {n:"Cervelo R5", r:"S"},
                {n:"Giant TCR Advanced SL", r:"A"}, {n:"Canyon Ultimate SLX", r:"A"}, {n:"Merida Reacto Team", r:"A"},
                {n:"Giant TCR Advanced Pro", r:"B"}, {n:"Bianchi Aria", r:"B"},
                {n:"Giant Contend AR", r:"C"}, {n:"Merida Scultura 400", r:"C"}
            ],
            g: [
                {n:"Shimano Dura-Ace R9270 Di2", r:"S"}, {n:"SRAM RED AXS (2024)", r:"S"}, {n:"Campagnolo Super Record Wireless", r:"S"},
                {n:"Shimano Ultegra R8170 Di2", r:"A"}, {n:"SRAM Force AXS", r:"A"},
                {n:"Shimano 105 R7170 Di2", r:"B"}, {n:"Shimano 105 Mechanical", r:"C"}
            ],
            w: [
                {n:"Enve SES 4.5 New Gen", r:"S"}, {n:"Reserve 52/63", r:"S"}, {n:"Roval Rapide CLX 3", r:"S"},
                {n:"Scope Artech 6", r:"S"}, {n:"Zipp 454 NSW", r:"S"}, {n:"Bora Ultra WTO 45", r:"S"},
                {n:"Shimano Dura-Ace C50 R9270", r:"S"}, {n:"Bontrager Aeolus RSL 51", r:"S"},
                {n:"Scope R5 Disc", r:"A"}, {n:"Zipp 404 Firecrest", r:"A"},
                {n:"Shimano 105 Carbon C46", r:"B"}, {n:"Shimano RS171", r:"C"}
            ],
            s: ["S-Works Power Mirror", "Fizik Vento Argo R1", "Selle Italia SLR Boost"],
            t: ["Continental GP5000 S TR", "Vittoria Corsa Next", "Pirelli P ZERO Race"],
            p: ["Shimano Dura-Ace PD-R9100", "Look Keo Blade Carbon", "Wahoo Speedplay Zero"],
            size: ["26C", "28C", "30C"]
        };

        function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            document.querySelectorAll('.rank-badge').forEach(el => el.style.display = 'none');
            document.getElementById('total-rank').style.display = 'none';

            let count = 0;
            const timer = setInterval(() => {
                const f = data.f[Math.floor(Math.random()*data.f.length)];
                const g = data.g[Math.floor(Math.random()*data.g.length)];
                const w = data.w[Math.floor(Math.random()*data.w.length)];

                document.getElementById('f').innerText = f.n;
                document.getElementById('g').innerText = g.n;
                document.getElementById('w').innerText = w.n;
                document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)] + " (" + data.size[Math.floor(Math.random()*data.size.length)] + ")";
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];

                document.querySelectorAll('.value').forEach(v => v.classList.add('rolling'));

                count++;
                if(count > 25) {
                    clearInterval(timer);
                    btn.disabled = false;
                    document.querySelectorAll('.value').forEach(v => v.classList.remove('rolling'));
                    showResult(f, g, w);
                }
            }, 60);
        }

        function showResult(f, g, w) {
            const parts = {f, g, w};
            let score = 0;
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };

            // 1. 히든 조합 체크
            let hero = null;
            const fn = f.n.toLowerCase();
            const wn = w.n.toLowerCase();

            if (fn.includes("colnago") && wn.includes("enve")) hero = "Tadej Pogačar (UAE)";
            else if (fn.includes("cervelo") && wn.includes("reserve")) hero = "Jonas Vingegaard (Visma)";
            else if (fn.includes("tarmac sl8") && wn.includes("roval")) hero = "Remco Evenepoel (Soudal)";
            else if (fn.includes("madone") && wn.includes("bontrager")) hero = "Mads Pedersen (Trek)";
            else if (fn.includes("dogma") && fn.includes("shimano")) hero = "Tom Pidcock (INEOS)";
            else if (fn.includes("aeroad") && wn.includes("shimano")) hero = "Mathieu van der Poel (Alpecin)";

            // 2. 뱃지 표시
            for(let key in parts) {
                const rankCode = parts[key].r || "C";
                const badge = document.getElementById('r-' + key);
                
                if (hero && (key === 'f' || key === 'w')) {
                    badge.innerText = "⭐ " + hero.split(' ')[0];
                    badge.className = 'rank-badge rank-S';
                } else {
                    badge.innerText = rankCode + " | " + rankNames[rankCode];
                    badge.className = 'rank-badge rank-' + rankCode;
                }
                badge.style.display = 'block';
                score += scoreMap[rankCode];
            }

            const avg = score / 3;
            let finalRank = "C";
            if (avg >= 3.7) finalRank = "S";
            else if (avg >= 3.0) finalRank = "A";
            else if (avg >= 2.0) finalRank = "B";

            const rVal = document.getElementById('rank-val');
            const rDesc = document.getElementById('rank-desc');
            const rLabel = document.getElementById('top-label');

            if (hero) {
                rLabel.innerText = "LEGENDARY BUILD DETECTED!";
                rVal.innerText = "HERO CLASS";
                rVal.className = "total-rank-value text-S";
                rDesc.innerText = `🔥 전설의 탄생! 당신은 ${hero} 선수의 세팅을 완성했습니다!`;
            } else {
                rLabel.innerText = "CONGRATULATIONS!";
                rVal.innerText = finalRank + " CLASS";
                rVal.className = 'total-rank-value text-' + finalRank;
                rDesc.innerText = finalDescriptions[finalRank];
            }
            
            document.getElementById('total-rank').style.display = 'block';
            document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
        }
    </script>
</body>
</html>
