<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Bike Draft</title>
    <style>
        :root { --primary: #ff3e3e; --s-rank: #ffcf40; --a-rank: #e2e2e2; --b-rank: #cd7f32; --c-rank: #7a7a7a; }
        body { background: #0a0a0a; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden; }
        .header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.6rem; color: var(--primary); margin: 0; letter-spacing: -1px; text-transform: uppercase; font-weight: 900; }
        
        /* 결과 박스 */
        .total-rank-box { margin-bottom: 20px; padding: 15px 30px; border-radius: 20px; background: #1a1a1a; border: 2px solid #333; text-align: center; display: none; width: 100%; max-width: 500px; box-sizing: border-box; }
        .total-rank-value { font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; line-height: 1; }
        .total-rank-desc { font-size: 0.85rem; color: var(--primary); font-weight: 600; }

        /* 드래프트 카드 그리드 */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 1100px; }
        .card { background: #151515; border: 1px solid #222; border-radius: 15px; padding: 12px 8px; text-align: center; position: relative; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; height: 100px; box-sizing: border-box; overflow: hidden; }
        .card.active { border-color: #444; background: #1c1c1c; }
        .label { font-size: 0.6rem; color: #555; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; }
        .rank-badge { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; font-weight: 900; padding: 2px 6px; border-radius: 50px; display: none; z-index: 10; }
        .value { font-size: 0.78rem; font-weight: 700; line-height: 1.2; color: #fff; word-break: keep-all; min-height: 2.5em; display: flex; align-items: center; justify-content: center; transition: 0.2s; }

        /* 애니메이션 효과 */
        .rolling { opacity: 0.4; filter: blur(2px); transform: scale(0.95); }
        .text-S { color: var(--s-rank); font-weight: 900; text-shadow: 0 0 10px rgba(255, 207, 64, 0.5); animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { opacity: 0.7; } to { opacity: 1; } }

        /* 버튼 */
        .btn-draw { margin-top: 30px; padding: 18px 80px; font-size: 1.4rem; font-weight: 900; color: white; background: var(--primary); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,62,62,0.3); }
        .btn-draw:disabled { background: #333; cursor: not-allowed; box-shadow: none; }

        /* 랭크 색상 */
        .rank-S { background: var(--s-rank); color: #000; box-shadow: 0 0 15px var(--s-rank); }
        .rank-A { background: var(--a-rank); color: #000; }
        .rank-B { background: var(--b-rank); color: #fff; }
        .rank-C { background: var(--c-rank); color: #fff; }

        /* 리스트 뷰어 */
        .data-viewer { margin-top: 50px; width: 100%; max-width: 1100px; padding: 0 10px; box-sizing: border-box; }
        .roster-toggle-btn { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #888; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .roster-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #111; border-radius: 0 0 12px 12px; }
        .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .data-list { font-size: 0.7rem; color: #aaa; max-height: 300px; overflow-y: auto; border-top: 1px solid #222; }
        .data-item { display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; padding: 6px 0; }
        .rank-S-txt { color: var(--s-rank); font-weight: bold; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header"><h1>너만의 자전거로 너만의 라이딩을 해</h1></div>
    
    <div id="total-rank" class="total-rank-box">
        <div class="total-rank-value" id="rank-val">-</div>
        <div id="rank-desc" class="total-rank-desc">-</div>
    </div>

    <div class="grid">
        <div class="card" id="card-f"><div class="rank-badge" id="r-f"></div><div class="label">Frame</div><div class="value" id="f">---</div></div>
        <div class="card" id="card-g"><div class="rank-badge" id="r-g"></div><div class="label">Groupset</div><div class="value" id="g">---</div></div>
        <div class="card" id="card-w"><div class="rank-badge" id="r-w"></div><div class="label">Wheelset</div><div class="value" id="w">---</div></div>
        <div class="card"><div class="label">Saddle</div><div class="value" id="s">---</div></div>
        <div class="card"><div class="label">Tire</div><div class="value" id="t">---</div></div>
        <div class="card"><div class="label">Pedal</div><div class="value" id="p">---</div></div>
    </div>

    <button class="btn-draw" onclick="run()">가즈아~</button>

    <div class="data-viewer">
        <button class="roster-toggle-btn" onclick="toggleRoster()">전체 로스터 리스트 보기</button>
        <div id="roster-content" class="roster-content">
            <div class="data-grid">
                <div class="data-column"><h3>프레임 (<span id="count-f">0</span>)</h3><div id="list-f" class="data-list"></div></div>
                <div class="data-column"><h3>휠셋 (<span id="count-w">0</span>)</h3><div id="list-w" class="data-list"></div></div>
                <div class="data-column"><h3>그룹셋 (<span id="count-g">0</span>)</h3><div id="list-g" class="data-list"></div></div>
            </div>
        </div>
    </div>

    <script>
        const data = {
            f: [
                {b:"Specialized", n:"S-Works Tarmac SL8", r:"S"}, {b:"Specialized", n:"S-Works Aethos", r:"S"}, {b:"Specialized", n:"S-Works Roubaix SL8", r:"S"}, {b:"Specialized", n:"S-orks Shiv TT", r:"S"}, {b:"Specialized", n:"Tarmac SL8 Pro", r:"A"}, {b:"Specialized", n:"Aethos Pro", r:"A"}, {b:"Specialized", n:"Roubaix SL8 Expert", r:"A"}, {b:"Specialized", n:"Tarmac SL7 Comp", r:"B"}, {b:"Specialized", n:"Allez E5", r:"C"},
                {b:"Trek", n:"Madone SLR 9 Gen 8", r:"S"}, {b:"Trek", n:"Emonda SLR 9", r:"S"}, {b:"Trek", n:"Domane SLR 9", r:"S"}, {b:"Trek", n:"Madone SL 7", r:"A"}, {b:"Trek", n:"Emonda SL 7", r:"A"}, {b:"Trek", n:"Domane SL 7", r:"A"}, {b:"Trek", n:"Emonda SL 5", r:"B"}, {b:"Trek", n:"Domane AL 2", r:"C"},
                {b:"Canyon", n:"Aeroad CFR", r:"S"}, {b:"Canyon", n:"Ultimate CFR", r:"S"}, {b:"Canyon", n:"Endurace CFR", r:"S"}, {b:"Canyon", n:"Speedmax CFR", r:"S"}, {b:"Canyon", n:"Aeroad CF SLX", r:"A"}, {b:"Canyon", n:"Ultimate CF SLX", r:"A"}, {b:"Canyon", n:"Endurace CF SLX", r:"A"}, {b:"Canyon", n:"Aeroad CF SL", r:"B"}, {b:"Canyon", n:"Ultimate CF SL", r:"B"}, {b:"Canyon", n:"Endurace AL", r:"C"},
                {b:"Cervelo", n:"S5", r:"S"}, {b:"Cervelo", n:"R5", r:"S"}, {b:"Cervelo", n:"P5", r:"S"}, {b:"Cervelo", n:"Soloist", r:"A"},
                {b:"Pinarello", n:"Dogma F", r:"S"}, {b:"Pinarello", n:"Dogma X", r:"S"}, {b:"Pinarello", n:"F7", r:"A"}, {b:"Pinarello", n:"X7", r:"B"},
                {b:"Colnago", n:"Y1Rs", r:"S"}, {b:"Colnago", n:"V5Rs", r:"S"}, {b:"Colnago", n:"V4Rs", r:"S"}, {b:"Colnago", n:"C68", r:"S"},
                {b:"Cannondale", n:"SuperSix EVO Lab71", r:"S"}, {b:"Cannondale", n:"SystemSix Hi-MOD", r:"S"}, {b:"Cannondale", n:"SuperSix EVO Hi-MOD", r:"A"},
                {b:"Giant", n:"Propel Advanced SL 0", r:"S"}, {b:"Giant", n:"TCR Advanced SL 0", r:"S"}, {b:"Giant", n:"Defy Advanced SL", r:"S"},
                {b:"BMC", n:"Teammachine SLR01", r:"S"}, {b:"Scott", n:"Foil RC Ultimate", r:"S"}, {b:"Factor", n:"OSTRO VAM", r:"S"},
                {b:"Winspace", n:"T1550 (Aero)", r:"S"}, {b:"SEKA", n:"Exceed RDC", r:"S"}, {b:"Evolve", n:"Cima", r:"S"}
            ],
            g: [
                {b:"Shimano", n:"Dura-Ace R9270 Di2", r:"S"}, {b:"SRAM", n:"RED AXS (2024)", r:"S"},
                {b:"Shimano", n:"Ultegra R8170 Di2", r:"A"}, {b:"Shimano", n:"105 Mechanical", r:"C"}
            ],
          w: [
            // --- S RANK (최상급 기함 휠셋) ---
            {b:"Scope", n:"Artech 2 (Hill Climb)", r:"S"}, {b:"Scope", n:"Artech 4 (All-road)", r:"S"}, {b:"Scope", n:"Artech 6 (Aero)", r:"S"},
            {b:"Roval", n:"Rapide CLX III", r:"S"}, {b:"Roval", n:"Alpinist CLX III", r:"S"},
            {b:"Zipp", n:"454 NSW", r:"S"}, {b:"Zipp", n:"353 NSW", r:"S"},
            {b:"Enve", n:"SES 2.3", r:"S"}, {b:"Enve", n:"SES 3.4", r:"S"}, {b:"Enve", n:"SES 4.5", r:"S"}, {b:"Enve", n:"SES 6.7", r:"S"}, {b:"Enve", n:"PRO 4.5", r:"S"},
            {b:"Lightweight", n:"Meilenstein Evo", r:"S"}, {b:"Lightweight", n:"Fernweg Evo", r:"S"}, {b:"Lightweight", n:"Obermayer Evo", r:"S"},
            {b:"Princeton", n:"Wake 6560 Strada", r:"S"}, {b:"Princeton", n:"Wake 7580", r:"S"}, {b:"Princeton", n:"Peak 4550", r:"S"},
            {b:"Cadex", n:"Max 40", r:"S"}, {b:"Cadex", n:"50 Ultra", r:"S"}, {b:"Cadex", n:"65 Disc", r:"S"},
            {b:"Shimano", n:"Dura-Ace C36 R9270", r:"S"}, {b:"Shimano", n:"Dura-Ace C50 R9270", r:"S"}, {b:"Shimano", n:"Dura-Ace C60 R9270", r:"S"},
            {b:"Campagnolo", n:"Bora Ultra WTO 33", r:"S"}, {b:"Campagnolo", n:"Bora Ultra WTO 45", r:"S"}, {b:"Campagnolo", n:"Bora Ultra WTO 60", r:"S"},
            {b:"Bontrager", n:"Aeolus RSL 37", r:"S"}, {b:"Bontrager", n:"Aeolus RSL 51", r:"S"}, {b:"Bontrager", n:"Aeolus RSL 62", r:"S"},
            {b:"Reserve", n:"40/44", r:"S"}, {b:"Reserve", n:"52/63", r:"S"}, {b:"Reserve", n:"34/37", r:"S"},
            {b:"Corima", n:"MCC DX 47mm", r:"S"}, {b:"Corima", n:"WS Black DX", r:"S"},
            {b:"Black Inc", n:"Five", r:"S"}, {b:"Black Inc", n:"Sixty", r:"S"}, {b:"Black Inc", n:"Twenty", r:"S"},
            {b:"Hunt", n:"Limitless 48 Aerodynamicist", r:"S"}, {b:"Hunt", n:"32 Aerodynamicist UD Carbon", r:"S"},
            {b:"Partington", n:"R-Series MKII", r:"S"}, {b:"Syncros", n:"Capital SL 40", r:"S"}, {b:"DT Swiss", n:"ARC 1100 DICUT 50", r:"S"},
        
            // --- A RANK (상급 퍼포먼스 휠셋) ---
            {b:"Roval", n:"Rapide CLX II", r:"A"}, {b:"Roval", n:"Alpinist CLX II", r:"A"},
            {b:"Zipp", n:"404 Firecrest", r:"A"}, {b:"Zipp", n:"303 Firecrest", r:"A"}, {b:"Zipp", n:"808 Firecrest", r:"A"},
            {b:"Enve", n:"Foundation 45", r:"A"}, {b:"Enve", n:"Foundation 65", r:"A"},
            {b:"DT Swiss", n:"ARC 1400 DICUT 50", r:"A"}, {b:"DT Swiss", n:"ERC 1400 DICUT", r:"A"}, {b:"DT Swiss", n:"PRC 1400 Spline", r:"A"},
            {b:"Shimano", n:"Ultegra C36 R8170", r:"A"}, {b:"Shimano", n:"Ultegra C50 R8170", r:"A"}, {b:"Shimano", n:"Ultegra C60 R8170", r:"A"},
            {b:"Campagnolo", n:"Bora WTO 45", r:"A"}, {b:"Campagnolo", n:"Bora WTO 60", r:"A"},
            {b:"Bontrager", n:"Aeolus Pro 51", r:"A"}, {b:"Bontrager", n:"Aeolus Pro 37", r:"A"},
            {b:"Giant", n:"SLR 0 50 Disc", r:"A"}, {b:"Giant", n:"SLR 0 36 Disc", r:"A"},
            {b:"Vision", n:"Metron 45 SL Disc", r:"A"}, {b:"Vision", n:"Metron 60 SL Disc", r:"A"},
            {b:"Mavic", n:"Cosmic SLR 45 Disc", r:"A"}, {b:"Mavic", n:"Ksyrium SL Disc", r:"A"},
            {b:"FFWD", n:"RYOT 55", r:"A"}, {b:"FFWD", n:"RYOT 44", r:"A"},
            {b:"HED", n:"Vanquish RC4 Performance", r:"A"}, {b:"HED", n:"Vanquish RC6 Performance", r:"A"},
            {b:"Fulcrum", n:"Speed 42 Disc", r:"A"}, {b:"Fulcrum", n:"Speed 57 Disc", r:"A"},
            {b:"Vincents", n:"Berg", r:"A"}, {b:"Hunt", n:"50 Carbon Wide Aero", r:"A"},
        
            // --- B RANK (가성비 및 중급 휠셋) ---
            {b:"Roval", n:"Rapide CL II", r:"B"}, {b:"Roval", n:"Alpinist CL II", r:"B"}, {b:"Roval", n:"C38 Disc", r:"B"},
            {b:"Zipp", n:"303 S Tubeless Disc", r:"B"},
            {b:"Shimano", n:"105 Carbon C46", r:"B"}, {b:"Shimano", n:"105 Carbon C32", r:"B"},
            {b:"Bontrager", n:"Aeolus Elite 50", r:"B"}, {b:"Bontrager", n:"Aeolus Elite 35", r:"B"},
            {b:"Giant", n:"SLR 1 50 Disc", r:"B"}, {b:"Giant", n:"SLR 1 42 Disc", r:"B"},
            {b:"Fulcrum", n:"Wind 42", r:"B"}, {b:"Fulcrum", n:"Wind 57", r:"B"},
            {b:"DT Swiss", n:"P1800 Spline 32", r:"B"}, {b:"DT Swiss", n:"ER1600 Spline", r:"B"},
            {b:"Mavic", n:"Cosmic SL 45 Disc", r:"B"},
            {b:"Vision", n:"Team 35 Disc", r:"B"}, {b:"Vision", n:"SC 55 Disc", r:"B"}, {b:"Vision", n:"SC 40 Disc", r:"B"},
            {b:"Campagnolo", n:"Scirocco Disc", r:"B"},
            {b:"Hunt", n:"4 Season Aero", r:"B"}
        ],
            s: ["S-Works Power Mirror", "Fizik Vento Argo R1", "Selle Italia SLR Boost"],
            t: ["Continental GP5000 S TR", "Vittoria Corsa PRO", "Pirelli P ZERO Race"],
            p: ["Shimano Dura-Ace PD-R9100", "Look Keo Blade", "Wahoo Speedplay Nano"],
            size: ["25C", "28C", "30C"]
        };

        // S급 등장 연출 (등급 -> 제조사 -> 모델)
        async function animateValue(id, item) {
            const el = document.getElementById(id);
            el.classList.remove('rolling');
            
            if (item.r === 'S') {
                el.innerHTML = `<span class="text-S">RANK: S</span>`;
                await new Promise(r => setTimeout(r, 700));
                el.innerHTML = `<span class="text-S">${item.b}</span>`;
                await new Promise(r => setTimeout(r, 700));
                el.innerHTML = `<span class="text-S">${item.n}</span>`;
            } else {
                el.innerText = item.n;
            }
        }

        async function run() {
            const btn = document.querySelector('.btn-draw');
            btn.disabled = true;
            document.querySelectorAll('.rank-badge').forEach(el => el.style.display = 'none');
            document.getElementById('total-rank').style.display = 'none';

            // 롤링 시작
            const values = document.querySelectorAll('.value');
            values.forEach(v => v.classList.add('rolling'));

            let count = 0;
            const timer = setInterval(() => {
                document.getElementById('f').innerText = data.f[Math.floor(Math.random()*data.f.length)].n;
                document.getElementById('g').innerText = data.g[Math.floor(Math.random()*data.g.length)].n;
                document.getElementById('w').innerText = data.w[Math.floor(Math.random()*data.w.length)].n;
                document.getElementById('s').innerText = data.s[Math.floor(Math.random()*data.s.length)];
                document.getElementById('t').innerText = data.t[Math.floor(Math.random()*data.t.length)];
                document.getElementById('p').innerText = data.p[Math.floor(Math.random()*data.p.length)];
                count++;
                if (count > 20) clearInterval(timer);
            }, 60);

            await new Promise(r => setTimeout(r, 1500)); // 1.5초 후 멈춤 시작

            // 결과 선정
            const resF = data.f[Math.floor(Math.random()*data.f.length)];
            const resG = data.g[Math.floor(Math.random()*data.g.length)];
            const resW = data.w[Math.floor(Math.random()*data.w.length)];

            // 카드별 순차 중지 및 애니메이션
            await animateValue('f', resF);
            await animateValue('g', resG);
            await animateValue('w', resW);

            // 나머지 파츠 즉시 중지
            document.querySelectorAll('.rolling').forEach(v => v.classList.remove('rolling'));
            
            showResult(resF, resG, resW);
            btn.disabled = false;
        }

        function showResult(f, g, w) {
            const scoreMap = { "S": 4, "A": 3, "B": 2, "C": 1 };
            const parts = {f, g, w};
            let score = 0;

            for (let key in parts) {
                const r = parts[key].r;
                const badge = document.getElementById('r-' + key);
                badge.innerText = r;
                badge.className = 'rank-badge rank-' + r;
                badge.style.display = 'block';
                score += scoreMap[r];
            }

            const avg = score / 3;
            const finalRank = avg >= 3.7 ? "S" : avg >= 3.0 ? "A" : avg >= 2.0 ? "B" : "C";
            
            document.getElementById('rank-val').innerText = finalRank + " CLASS";
            document.getElementById('rank-val').className = 'total-rank-value text-' + (finalRank === 'S' ? 'S' : '');
            document.getElementById('rank-desc').innerText = finalRank === 'S' ? "🏆 천상계 기함 세팅 완료!" : "🚴 즐거운 라이딩 되세요!";
            document.getElementById('total-rank').style.display = 'block';
            document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
        }

        function toggleRoster() {
            const content = document.getElementById('roster-content');
            content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
        }

        function init() {
            const configs = [{k:'f', l:'list-f', c:'count-f'}, {k:'w', l:'list-w', c:'count-w'}, {k:'g', l:'list-g', c:'count-g'}];
            configs.forEach(conf => {
                document.getElementById(conf.c).innerText = data[conf.k].length;
                document.getElementById(conf.l).innerHTML = data[conf.k].map(i => `
                    <div class="data-item">
                        <span class="${i.r==='S'?'rank-S-txt':''}">${i.b} ${i.n}</span>
                        <span style="opacity:0.3;font-size:0.6rem;">${i.r}</span>
                    </div>`).join('');
            });
        }
        window.onload = init;
    </script>
</body>
</html>
